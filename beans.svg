<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich orange gradient filling edge-to-edge -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffaf3c" />
      <stop offset="100%" stop-color="#e67e22" />
    </linearGradient>
  </defs>

  <!-- Edge-to-edge rounded square background (No border, full orange fill) -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)" />

  <!-- Large Centered Coffee Bean -->
  <g transform="translate(256, 256)">
    <ellipse cx="0" cy="0" rx="130" ry="200" fill="#1b1e23" transform="rotate(-15)" />
    <path d="M -20,-170 C 32,-70 -32,70 20,170 C 8,175 -32,70 6,-70 C -6,-120 -20,-170 -20,-170 Z" fill="#ffaf3c" opacity="0.95" />
  </g>
</svg>
