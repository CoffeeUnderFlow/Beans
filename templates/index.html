<!DOCTYPE html>
<html lang="en" data-theme="{{ theme|default('dark') }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beans Extractor</title>
    <!-- sidebar.css owns tokens/theme/shell/settings; style.css owns the extractor card. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Sidebar shell: contains workspace, downloads drawer and settings modal -->
    {% include 'sidebar.html' %}

    <!-- Main extractor content (moved into the workspace by sidebar.js) -->
    <div class="extractor-card">
        <div id="error-banner" class="error-banner" style="display: none;"></div>

        <!-- STEP 1: URL input -->
        <div id="phase-2">
            <header class="hero">
                <h1 class="hero-title">Paste a link.<span>Get the file.</span></h1>
                <p class="hero-sub">Video, audio and images from almost anywhere.</p>
            </header>
            <form id="inspect-form" class="input-group">
                <input type="text" id="url-input" placeholder="Paste video or media link..." required autofocus>
                <button type="submit" id="inspect-btn" class="btn-primary">
                    <span id="btn-text">Analyze</span>
                    <div class="loader-dots" id="btn-loader" style="display: none;">
                        <span></span><span></span><span></span><span></span>
                    </div>
                </button>
            </form>
        </div>

        <!-- STEP 2: format / image selection -->
        <div id="phase-3" class="phase-view" style="display: none;">

            <!-- VIDEO/AUDIO UI -->
            <div id="video-ui">
                <div class="preview-box">
                    <img id="meta-thumb" src="" alt="Thumbnail">
                    <div class="preview-meta">
                        <div id="meta-title">Loading...</div>
                        <div id="meta-duration">00:00</div>
                    </div>
                </div>

                <p class="section-label">Select Output Format</p>
                <div id="quality-grid" class="quality-grid"></div>

                <button id="download-btn" class="btn-primary" onclick="triggerDownload()">
                    Download Stream
                </button>
            </div>

            <!-- IMAGE GALLERY UI -->
            <div id="image-ui" style="display: none;">
                <div class="carousel-viewport">
                    <button id="carousel-prev" class="btn-secondary carousel-btn"
                        aria-label="Previous image">&#8592;</button>

                    <img id="carousel-main-img" src="" alt="Gallery Preview">

                    <button id="carousel-next" class="btn-secondary carousel-btn"
                        aria-label="Next image">&#8594;</button>
                </div>

                <p class="section-label">Select Images to Download</p>
                <div id="image-grid" class="quality-grid"></div>

                <button id="dl-selected-btn" class="btn-primary" onclick="triggerImageDownload()">
                    Download Selected
                </button>
            </div>

            <!-- Progress is shown in the Downloads drawer, so this just returns to step 1. -->
            <button class="btn-secondary cancel-btn" onclick="resetToPhase2()">
                Extract Another
            </button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>
    <script src="{{ url_for('static', filename='sidebar.js') }}"></script>
</body>

</html>
